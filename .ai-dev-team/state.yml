product: mekras/ai-dev-team
applied_version: 0.29.8
updated_at: 2026-10-23
setup:
  visibility: public
  operating_context:
    kind: noncommercial
  project_profile:
    forms: [ai-skills]
    users: [developer, maintainer]
    interfaces: [agent-tooling, cli]
    delivery: [published-apm-package]
  commit_messages:
    scheme: custom
    custom:
      format: "Русская тема с прописной буквы в форме результата"
      examples:
        - "Стабилизирована публикация коллекции"
        - "Исправлено обновление манифеста APM"
  git:
    enabled: true
  changelog:
    status: present
    path: CHANGELOG.md
  knowledge:
    status: present
    path: knowledge/
    layout: portable_data
    migration_status: completed
    migration_completed_at: 2026-07-10
  impact_graph:
    status: present
    path: .ai-dev-team/project-impact.json
    schema_version: 2
  decision_records:
    status: present
    scope: project_decisions
    path: docs/decisions/
    filename_pattern: DR-NNNN.md
    registry_path: docs/decisions/README.md
  sdd:
    status: adopted
    level: spec-as-source
    decision_path: docs/decisions/DR-0010.md
    scope:
      - published-skill-collection
      - required-verification-build-release-tooling
    specification_paths:
      - docs/concept.md
      - docs/requirements/**
      - docs/decisions/**
      - docs/evaluation-protocol.md
    specification_selection: >-
      Применяются утверждённые требования, действующие решения и критерии
      в их предметной области. Предложения, гипотезы и прежняя реализация
      не становятся обязательными входами автоматически.
    derived_paths:
      - .apm/skills/**
      - tools/adapters/**
      - tools/lib/**
      - tools/compatibility/**
      - tools/git-hooks/**
      - tools/test-*.py
      - tools/validate-*.py
      - tools/analyze-subagent-sessions
      - tools/apm-audit-ci
      - tools/assess-subagent-policy-connection.py
      - tools/check-subagent-models
      - tools/codex-model-subagent
      - tools/codex-usage-report
      - tools/compatibility-summary.py
      - tools/discover-subagent-models
      - tools/evaluate-model-selection.py
      - tools/lint-commit-msg.py
      - tools/model-selection-input.sample.json
      - tools/run-apm-safe.py
      - tools/run-collection-checks.py
      - tools/run-execution-class
      - tools/run-fixture-checks.py
      - tools/run-project-tests.py
      - tools/run-skill-evals.py
      - tools/run-skill-script-contract-tests.py
      - tools/run-subagent-role
      - tools/sync-marketplace-manifest.py
      - .github/workflows/**
      - evals/fixtures/**/tests/*.py
    execution_input_paths:
      - AGENTS.md
      - .claude/CLAUDE.md
      - apm.yml
      - apm.lock.yaml
      - .gitignore
      - evals.sample.yml
    external_materials: only-explicit-references-from-approved-specifications
    change_record: delta-in-existing-canonical-specification
    approval: before-implementation
    approval_policy: docs/decisions/DR-0010.md#порядок-изменений
    exception_policy:
      path_pattern: .ai-dev-team/exceptions/<exception-id>.md
      rules_path: docs/decisions/DR-0010.md#порядок-временных-исключений
    review_condition: required-delivery-artifact-outside-defined-categories
    transition:
      status: in-progress
      specification_coverage: not-verified
      reconstruction: not-tested
      limitations:
        - Принятие процесса не подтверждает полноту спецификаций и восстановление.
        - Критерии внутри производных файлов ещё требуют независимого канонического описания.
        - Контур восстановления с версиями всех инструментов и командами ещё не проверен.
        - Материалы evals служат свидетельствами, их обязательность определяется спецификациями.
        - Источники о SDD и spec-as-source в проектном корпусе не найдены, основание принятия — решение владельца.
  subagents:
    status: disabled
    reason: "Отключены по прямому поручению пользователя"
    disabled_at: 2026-10-13
  version_review:
    from_version: 0.29.5
    to_version: 0.29.8
    evidence: >-
      Для версии 0.29.8 рассмотрен журнал изменений: обязательных действий при
      обновлении нет. Уточнения концепции и проверки связи задач с целями
      сопоставлены с docs/concept.md и AGENTS.md; изменение локальных правил не
      требуется. Аудитор tools/apm-audit-ci завершился с кодом 0 и подтвердил
      58 локальных переопределений.
  review:
    status: completed
    checked_at: '2026-10-23'
    method: самопроверка текущим корневым агентом
    directions:
    - name: рабочий контекст проекта
      status: сделано
      basis: Ранее подтверждённый некоммерческий контекст.
      evidence: setup.operating_context.kind = noncommercial сохранён. Нового выбора рабочего контекста
        нет.
      limitations: []
    - name: профиль проекта
      status: сделано
      basis: Подтверждённая публикуемая коллекция навыков для разработчика и сопровождающего.
      evidence: Профиль сверён с docs/concept.md, apm.yml, исходным деревом .apm/skills и README.md. Публикация
        через APM, цели claude, codex и hermes. Зависимость ai-dev-team остаётся зависимостью разработки.
      limitations: []
    - name: концепция проекта
      status: сделано
      basis: Действующая концепция docs/concept.md и решение DR-0008.
      evidence: 'По ait-docs-concept перечитана вся концепция: проблема трудоёмкого сопровождения правил,
        цель освободить внимание человека, способ через переносимую коллекцию, ожидаемый итог и управление
        сложностью связаны. Замена реализации навыков сохраняет замысел. Прямой указатель AGENTS.md ведёт
        к этому документу. Изменения не потребовались.'
      limitations: []
    - name: README.md
      status: сделано
      basis: Пользователь коллекции подключает её к своему проекту, сопровождающий работает с исходным репозиторием.
      evidence: 'По ait-readme проверен весь README.md: назначение и поддерживаемые среды предшествуют установке,
        команды установки используют 2.6.31 и цели из apm.yml, первым действием назван ai-setup-project.
        Разработка отделена от пользовательского пути. Минимум APM 0.29.1 согласован с release.yml и known-version-issues.md.
        Реальный локальный кандидат установлен и повторно установлен в трёх отдельных потребителях на APM
        0.33.0, все аудиты завершились с кодом 0.'
      limitations:
      - Повторная установка опубликованного выпуска не выполнялась. Проверен текущий локальный кандидат.
    - name: правила для агентов и клиентские инструкции
      status: сделано
      basis: Рукописный AGENTS.md и подключающий его .claude/CLAUDE.md.
      evidence: 'По ai-audit-agent-rules сверены цепочка входа, полнота чтения, язык, концепция, корпус,
        границы записи, Git, SDD и отключение подагентов. В обеих проекциях доступны ait-routing и ai-human-communication.
        Claude подключает @../AGENTS.md. Корневые инструкции сохранены, конфликтующих новых правил не добавлено.
        Строгий аудитор APM: код 0, 58 разрешённых локальных переопределений.'
      limitations:
      - Поведение новой корневой сессии отдельно не испытывалось. Это не блокирует настройку по критериям
        ait-setup.
    - name: журнал изменений
      status: сделано
      basis: CHANGELOG.md и действующее правило его сопровождения через ait-changelog.
      evidence: По ait-changelog проверены формат, раздел «Невыпущено» и соответствие выпущенной версии
        2.6.31 манифесту. Текущие изменения рабочей оснастки отражены одной записью для сопровождающего.
        Выпуск новой версии не выполнялся.
      limitations: []
    - name: журналы решений
      status: сделано
      basis: Ранее принятое местное соглашение в docs/decisions/README.md.
      evidence: По ait-decisions сверены предметная граница, имена DR-NNNN.md и реестр. Все 10 записей перечислены,
        ссылки на них существуют. Приоритеты заданы в AGENTS.md и DR-0001. Местное правило исключать статусы
        и сведения о принятии сохранено по прежнему решению пользователя.
      limitations:
      - Местное соглашение о статусах отличается от общей модели ait-decisions и имеет приоритет.
    - name: корпус знаний
      status: сделано
      basis: knowledge/corpus.yml, действующий допуск источников и поручение завершить настройку.
      evidence: 'По kc-setup и kc-inventory у всех 22 существующих источников настроен agent_route для индекса
        с разрешённой областью записи, 19 старых обозначений manual/web.run заменены. Новые источники не
        добавлялись, политика допуска и копирования сохранена. По kc-validation проверены все 133 извлечённых
        утверждения, их область, ограничения и применимость. Противоречий, требующих изменения настройки,
        не найдено. Цитаты сопоставлены с локальными артефактами. Строгая проверка структуры, допуска, утверждений,
        понятий, проверок снимков и публикуемого слоя: код 0 без прежних предупреждений об adapter manual.
        В operations.yml механические fetch, transcribe, traceability и source_check имеют команды, corpus_validation
        выполняет тесты и строгий валидатор. Остальные очереди выполняет текущий агент профильными навыками
        без подагентов. Непустые сценарии механики проверены 26 тестами, включая HTTP и штатный контроллер.'
      limitations:
      - 'Обновление индексов выполняет текущий агент, автоматический обход сайтов не заявлен. Все удалённые
        индексы заново не обновлялись. Рабочий веб-маршрут точечно проверен на документации APM для авторов:
        https://microsoft.github.io/apm/producer/.'
      - У 113 снимков записана локальная целостность без внешней сверки, у 8 — частичная проверка. Эти результаты
        не повышались. У 6 источников нет извлечённых утверждений, причины отсутствия содержательного локального
        текста отражены картами охвата. Для предметного использования нужны проверка оригинала и актуальности.
      - Три оставшихся раздела работ arXiv сохраняют прежнее отложенное состояние по ограничениям публикации.
        Полный проход содержательной переработки корпуса не является результатом настройки и не запускался.
      - Аудио и видео в текущих источниках нет. Контракт команды расшифровки проверен отдельным тестовым
        исполнителем. Настоящий Whisper и качество распознавания не испытывались, локальный файл модели
        отсутствует. Для будущих медиавходов действует предварительная проверка зависимостей и ресурсов.
    - name: разработка на основе спецификаций
      status: сделано
      basis: Принятый spec-as-source в setup.sdd и DR-0010.
      evidence: По ait-sdd сверены статус adopted, уровень, область, спецификации, производные артефакты,
        порядок подтверждения и исключений. AGENTS.md прямо вызывает ait-sdd в принятой области. Текущая
        настройка обслуживает корпус и состояние проекта вне производных артефактов продукта. Контракты
        публикуемых навыков не менялись.
      limitations:
      - Полнота спецификаций и реконструкция продукта остаются отдельной незавершённой работой setup.sdd.transition.
        Настройка принятого процесса не выдаётся за проверку восстановления.
    - name: граф влияния проекта
      status: сделано
      basis: Существующий граф схемы 2 и указатель в AGENTS.md.
      evidence: 'По ait-impact-analysis сохранены 13 смысловых вершин и 25 рёбер. Представления двух средств
        корпуса отнесены к существующей вершине development-support. Проверены validate, coverage и полный
        обход влияния: 984 пути сопоставлены, несопоставленных нет. Применимые проверки затронутых вершин
        выполнены, изменения продукта и корневых инструкций не потребовались.'
      limitations: []
    - name: уровень интерфейсных проверок
      status: не требуется
      basis: Раздел «Правила проверок» актуального ait-setup прямо исключает общий уровень из обязательных
        направлений.
      evidence: Прежняя отметка о блокировке снята. Поле setup.interface_checks отсутствует, значение не
        выбиралось и не подставлялось. Для конкретной команды выполнены её профильные проверки.
      limitations: []
    - name: .gitignore
      status: сделано
      basis: Существующие правила защиты локального слоя и проекций.
      evidence: 'Проверены *.local.*, *.local, *.py[cod], __pycache__, apm_modules и проекции .agents/.claude/.codex.
        Исключения сохраняют рукописный .claude/CLAUDE.md и манифесты. Полученные оригиналы и паспорта исключаются
        из Git: проверено непустой фикстурой. Локальные установочные проекты и журналы находятся в .local/.'
      limitations: []
    - name: лицензия
      status: сделано
      basis: Ранее принятая MIT.
      evidence: 'LICENSE содержит MIT License и соответствует license: MIT в apm.yml. Условия внешних источников
        и политика local_only/selected_fragments сохранены.'
      limitations:
      - Новый правовой аудит внешних материалов не выполнялся.
    - name: подагенты
      status: не требуется
      basis: Прямое решение пользователя об отключении.
      evidence: AGENTS.md, setup.subagents.status = disabled и subagents.local.toml сохранены. Подагенты,
        их настройка, квалификация и модельные эксперименты не запускались.
      limitations: []
    - name: индекс Git, схема сообщений коммитов и проверки
      status: сделано
      basis: Действующая политика индекса и custom-схема сообщений.
      evidence: 'Все неигнорируемые изменения добавлены в индекс без удаления исходных staged-изменений.
        Оба закреплённых примера темы прошли lint-commit-msg.py. apm run tests завершился с кодом 0: 54
        контрактных сценария и 40 тестовых проектов. Профильные тесты корпуса: 26, код 0. Рабочие копии
        оснастки совпадают с манифестом источника. Строгий аудитор APM, защищённое состояние Python и git
        diff --cached --check прошли. Коммит и push не выполнялись.'
      limitations:
      - Модельные проверки и независимый второй исполнитель не запускались. Выполнена самопроверка.
    installation_evidence:
      apm_version: 0.33.0
      candidate: isolated-local-source-without-devDependencies
      result_path: .local/ait-setup-install-20261023/results.json
      targets:
      - codex
      - claude
      - hermes
      top_level_skills_per_target: 15
      install_and_frozen_repeat_audit: all_exit_codes_zero
      working_projection_hashes_preserved: 23941
    completion_basis: 'Критерий завершения ait-setup: закрыты все обязательные направления настройки. Отдельные
      задачи наполнения корпуса, полная реконструкция продукта и испытание новых сеансов не подменяют этот
      критерий.'
    artifact_hashes:
      tools/corpus-queues.py: d09fa03b055dfd183316aa758f527dc7623cc3c535ec78aa43ce5a95df36d77e
      tools/corpus-queues-tests.py: 0828d3bcc7afdaaf16310eedbc8aa0ca1dc38544bf4bf00f2b20f1d405319930
      knowledge/operations.yml: cd6ac519a4d8b9d73c0b7fa44817badd5ec9e31502313a1bc4e2e0ed74a55bb9
    evaluation:
      decision: accept
      scope: полная настройка проекта по ait-setup
      executor: основной агент, самопроверка
      limitations: Ограничения источников и необязательных испытаний перечислены в соответствующих направлениях.
        Незакрытых обязательных направлений нет.
