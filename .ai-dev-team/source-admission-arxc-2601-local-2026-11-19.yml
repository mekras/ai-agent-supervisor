decision: Получить и обработать полный текст статьи arXiv 2601.20404v2 только в локальном слое корпуса.
  В Git публикуются собственные формулировки утверждений, короткие атрибутированные цитаты и метаданные.
authorization: Ответ владельца «Согласен» на предложение обработать 2601.20404v2 локально, чтобы разобрать
  расхождение исследований о стоимости работы агентов с контекстными файлами.
constraints:
- Лицензия версии — неисключительное право распространения arXiv без общей лицензии на повторную публикацию.
  Полный текст, исходники и PDF не попадают в Git.
- Цитаты в утверждениях короткие и служат только привязке утверждения к месту в статье.
- Рабочий диалог не включается в корпус.
