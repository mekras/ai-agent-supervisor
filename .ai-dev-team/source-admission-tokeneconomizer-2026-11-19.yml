decision: Добавить официальную документацию и выбранный код плагина TokenEconomizer как основание для
  правильной настройки плагина продуктом и для устранения и предупреждения расхождений внедряемых им
  сведений с правилами проекта.
authorization: Поручение «Добавь в корпус знаний необходимые источники чтобы продукт мог правильно настраивать
  tokeneconomizer, в т. ч. для устранения (а лучше предупреждения) этой проблемы» по находке аудита правил
  о противоречащей памятке плагина.
constraints:
- Допуск ограничен материалами публичного репозитория microsoft/TokenEconomizer на зафиксированном коммите.
- Рабочий диалог, локальное состояние плагина и выводы аудита не включаются в корпус.
- Полные снимки остаются локальными. Публикуются метаданные, собственные краткие формулировки фактов и
  короткие выдержки.
- Обновление корпуса не разрешает изменять навыки, правила проекта или настройки плагина.
