operations_version: 1

# Отчёт и состояние прохода являются локальными рабочими данными, а не частью
# публикуемого корпуса.
report:
  path: .local/reports/corpus-operations.md
run_state:
  path: .local/state/corpus-pipeline.json
human_attention:
  max_active_groups: 20
normalized_artifacts:
  - normalized.md
  - message.md
  - stenogram.txt

# Содержательные очереди — content_selection, normalize, statements,
# coverage_gap, semantic_review, strong_review, corroboration, concepts, impact_audit и
# apply_changes — выполняет агент через соответствующие kc-навыки. Для них нет
# безопасной универсальной команды: она не должна подменять смысловой разбор.
# Механические операции исполняются последовательно, по одной выбранной единице
# за запуск. Оригиналы, паспорта получения, сырые расшифровки и журналы проверки
# связей сохраняются в *.local.*. Повтор использует проверенный локальный результат.
# Для проектных команд нужны Python 3, PyYAML и POSIX.
# source_check обслуживает прежний договор единиц. Оценку происхождения новых
# снимков договора 2 (verification) выполняет агент: эта операция требует сверки
# свидетельств, локальный снимок сам по себе не означает verified.
stages:
  fetch:
    commands:
      - id: fetch-selected-unit
        argv: [python3, -B, tools/corpus-queues.py, fetch, knowledge]
        working_directory: .
        write_paths: [knowledge]
        required: true
  transcribe:
    commands:
      - id: transcribe-local-media
        argv: [python3, -B, tools/corpus-queues.py, transcribe, knowledge]
        working_directory: .
        write_paths: [knowledge]
        required: true
    # Нужны Linux, Whisper, ffmpeg и локальная модель ~/.cache/whisper/large-v3.pt.
    # Автоматическая загрузка модели отключена. CPU: два потока, nice 19,
    # ionice idle при доступности. Нет модели или ресурсов — стадия сохраняется.
  traceability:
    commands:
      - id: check-statement-links
        argv: [python3, -B, tools/corpus-queues.py, traceability, knowledge]
        working_directory: .
        write_paths: [knowledge]
        required: true
  source_check:
    commands:
      - id: check-extracted-sources
        argv:
          - python3
          - tools/check-corpus-sources.py
          - knowledge
        working_directory: .
        write_paths: [knowledge]
        required: true
  corpus_validation:
    commands:
      - id: test-corpus-queues
        argv: [python3, -B, tools/corpus-queues-tests.py]
        working_directory: .
        write_paths: [.local]
        required: true
      - id: validate-corpus-layout
        argv:
          - python3
          - .agents/skills/kc-inventory/scripts/validate-corpus-layout.py
          - knowledge
          - --strict-statements
          - --strict-concepts
          - --strict-verification
          - --strict-admission
          - --project-root
          - .
        working_directory: .
        write_paths: [knowledge]
        required: true

# Команда fetch получает только выбранные единицы с собственным URL и разрешением
# на полный локальный снимок. Обновление индексов источников остаётся отдельной
# операцией: manual и агентные маршруты не выдаются за исполняемые адаптеры.
adapters: {}

# Производные индексы пересобираются через
# ``python3 tools/rebuild-corpus-indexes.py``. Мост приводит базовый каталог
# путей к договору корпуса, не изменяя установленные APM-зависимости.
