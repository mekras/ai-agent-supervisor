  - 'Работы различаются агентами и моделями, размером задач и мерой стоимости: время
    и выходные токены здесь, стоимость в долларах и шаги у Gloaguen и соавторов, вызовы
    и токены у Khatri.'
  - 'Усиленная проверка выполнена основным агентом 2026-11-19 как самопроверка по
    полным текстам трёх работ. Независимая проверка не выполнялась: запуск подагентов
    в проекте отключён.'
