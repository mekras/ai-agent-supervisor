- id: CODX-072
  source_id: CODX
  item_id: CODX--hooks
  kind: fact
  text: Хуки загружаются из активных пользовательских и проектных слоёв, включая hooks.json и таблицы
    hooks в config.toml, а также из включённых плагинов. Совпадающие хуки объединяются, более высокий
    слой не заменяет остальные. Доверие к проектному слою не отключает пользовательские и системные хуки.
  artifact: normalized.local.md
