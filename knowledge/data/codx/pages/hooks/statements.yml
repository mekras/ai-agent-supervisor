  source_id: CODX
  item_id: CODX--hooks
  kind: fact
  text: Хуки, не управляемые политикой администратора, требуют доверия к точному определению. Изменение
    определения требует новой проверки его хэша. В CLI просмотр и отключение доступны через /hooks, управляемые
    хуки имеют другой порядок.
  artifact: normalized.local.md
