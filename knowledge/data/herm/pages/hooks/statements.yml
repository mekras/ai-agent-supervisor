- id: HERM-003
  source_id: HERM
  item_id: HERM--hooks
  kind: fact
  text: Согласие на командный хук хранится для пары событие и строка команды. Правка самого скрипта не
    отменяет сохранённого согласия автоматически. Поэтому согласие оснастки не доказывает согласования
    нового поведения.
  artifact: normalized.local.md
  checked_at: '2026-10-19'
  scope:
    section_title: Consent model
    limitations: Проверено по документации, не испытанием установленной оснастки.
