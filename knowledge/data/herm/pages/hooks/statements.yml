- id: HERM-001
  source_id: HERM
  item_id: HERM--hooks
  kind: fact
  text: Хуки шлюза обнаруживаются в каталоге hooks домашнего каталога профиля. Размещение HOOK.yaml и
    handler.py подключает их, удаление или переименование отключает. Они относятся к шлюзу, а не к произвольному
    запуску CLI.
  artifact: normalized.local.md
