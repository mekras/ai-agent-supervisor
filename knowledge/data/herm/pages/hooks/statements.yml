- id: HERM-004
  source_id: HERM
  item_id: HERM--hooks
  kind: fact
  text: Ошибки командных хуков обычно допускают продолжение. Для pre_tool_call параметр fail_closed может
    сделать ошибку блокирующей. Код выхода 2 у этого события также блокирует вызов. Поведение других событий
    отличается.
  artifact: normalized.local.md
  checked_at: '2026-10-19'
  scope:
    section_title: Fail-open vs fail-closed
