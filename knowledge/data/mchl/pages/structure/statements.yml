- id: MCHL-003
  source_id: MCHL
  item_id: MCHL--structure
  kind: fact
  text: Однородные по назначению элементы списка оформляют одинаково. Во вводной фразе
    рекомендуется назвать общее для элементов понятие, а не заканчивать её предлогом,
    который должен соединяться с каждым пунктом.
  excerpt: обобщающее слово
