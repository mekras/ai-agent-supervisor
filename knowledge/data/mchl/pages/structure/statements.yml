- id: MCHL-002
  source_id: MCHL
  item_id: MCHL--structure
  kind: fact
  text: Рабочее оглавление показывает уровни заголовков. По нему авторы предлагают
    отдельно сравнить заголовки одного уровня и проверить подчинённые заголовки относительно
    родительского.
  excerpt: сопоставить по содержанию одноступенные заголовки
