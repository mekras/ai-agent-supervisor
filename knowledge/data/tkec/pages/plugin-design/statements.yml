- id: TKEC-026
  source_id: TKEC
  item_id: TKEC--plugin-design
  kind: fact
  text: Выученный факт — это текст, внедряемый в контекст агента и выведенный из вывода команд, который контролирует
    репозиторий. Факты предлагателя формулируются свободно. Для недоверенного репозитория документация советует
    оставить микронавыки выключенными или использовать `microskills=envfacts` и читать выученное через `te microskills`.
  artifact: normalized.local.md
  checked_at: '2026-11-19'
  scope:
    section_title: 4. State and privacy
    limitations: Проверено по документации на коммите 4a04fe4, не испытанием установленной оснастки.
