- id: TKEC-014
  source_id: TKEC
  item_id: TKEC--plugin-readme
  kind: fact
  text: Сокращение инструментов (`toolprune`) в режиме `auto` исключает долго не используемые инструменты без вопроса
    человеку. В Claude Code правила запрета записываются в `.claude/settings.local.json` репозитория, созданный
    плагином файл добавляется в `.git/info/exclude`, а правила запрета, написанные человеком, плагин не трогает.
    Режим `toolprune=propose` только предлагает список до `toolprune apply`.
  artifact: normalized.local.md
