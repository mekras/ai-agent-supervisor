  kind: fact
  text: 'Изменение настройки вступает в силу со следующего вызова хука: для фактов и списка запрета — со следующего
    старта сессии. `TE_DISABLE=1` выключает плагин для одной сессии, а `TE_MICROSKILLS` меняет режим микронавыков
    для неё.'
