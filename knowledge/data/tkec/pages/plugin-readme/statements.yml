- id: TKEC-001
  source_id: TKEC
  item_id: TKEC--plugin-readme
  kind: fact
  text: 'Микронавыки (`microskills`) по умолчанию выключены. Значение `on` означает `envfacts+distiller`: факты
    без вызовов модели и предлагатель фактов на основе модели. Допустимы также `off`, `envfacts` (только факты без
    вызовов модели) и `distiller` (только предлагатель).'
  artifact: normalized.local.md
  checked_at: '2026-11-19'
