  text: 'Предлагатель фактов запускается раз в `microskills_propose_every` сессий (по умолчанию 3). Модель читает
    сводки недавних сессий: выполненные команды, изменённые файлы, неудачные команды со строкой ошибки — и пишет
    факты о репозитории с шаблонами, которые проверяют их на следующих сессиях.'
