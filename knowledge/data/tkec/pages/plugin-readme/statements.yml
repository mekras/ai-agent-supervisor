- id: TKEC-002
  source_id: TKEC
  item_id: TKEC--plugin-readme
  kind: fact
  text: Настройки плагина задаются для текущего репозитория или для всех репозиториев с `--global` и общие для всех
    агентов, работающих в репозитории. Для одной сессии побеждает переменная окружения `TE_<ИМЯ>`, затем настройки
    репозитория, затем глобальные, затем значения по умолчанию. `config unset` возвращает на один уровень назад.
  artifact: normalized.local.md
  checked_at: '2026-11-19'
  scope:
    section_title: Settings
    limitations: Проверено по документации на коммите 4a04fe4, не испытанием установленной оснастки.
