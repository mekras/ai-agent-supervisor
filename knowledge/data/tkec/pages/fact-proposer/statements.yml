- id: TKEC-034
  source_id: TKEC
  item_id: TKEC--fact-proposer
  kind: inference
  text: Функция `build_proposer_prompt` собирает подсказку из имени репозитория, уже известных фактов, имён признаков,
    сводок сессий и необработанных фрагментов команд. Файлов инструкций репозитория, например `AGENTS.md` или `CLAUDE.md`,
    среди её входов нет, поэтому предлагатель не может сверить факт с правилами проекта.
  artifact: normalized.local.md
  checked_at: '2026-11-19'
  scope:
    section_title: build_proposer_prompt
    limitations: Вывод сделан по сигнатуре и телу функции на одном коммите. Другие пути внедрения контекста плагином
      отдельно не проверялись.
