- id: TKEC-030
  source_id: TKEC
  item_id: TKEC--microskills-readme
  kind: fact
  text: Ручное забывание (`te microskills forget`) убирает факт из блока и заносит идентификатор в множество забытых,
    поэтому факт больше не формируется под этим идентификатором. Предлагатель также отклоняет новый идентификатор,
    который подтверждается только свидетельствами забытого факта.
