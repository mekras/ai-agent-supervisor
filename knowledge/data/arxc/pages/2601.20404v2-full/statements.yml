  item_id: ARXC--2601.20404v2-full
  kind: fact
  text: На 10 репозиториях и 124 PR наличие AGENTS.md связано с меньшей медианной
    длительностью работы агента (на 28,64 %) и меньшим числом выходных токенов (на
    16,58 %) при сопоставимом выполнении задач.
