- id: ARXC-117
  source_id: ARXC
  item_id: ARXC--2601.20404v2-full
  kind: observation
  text: Данные трёх работ о стоимости работы с контекстными файлами расходятся. Здесь
    Codex с файлом работал быстрее и тратил меньше выходных токенов без значимого
    изменения суммарных токенов. В 2602.11988v2 стоимость и число шагов выросли примерно
    на 20 % (ARXC-025). В 2607.27250v1 метрики Codex не изменились (ARXC-076).
  excerpt: Providing an `AGENTS.md` file reduces generation cost.
