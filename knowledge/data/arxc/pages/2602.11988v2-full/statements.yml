- id: ARXC-004
  source_id: ARXC
  item_id: ARXC--2602.11988v2-full
  kind: fact
  text: Контекстные файлы в среднем увеличивают стоимость вывода больше чем на 20
    % и при этом в общем случае не повышают долю решённых задач. Наблюдение устойчиво
    для разных моделей, агентов, сгенерированных и написанных разработчиками файлов.
  excerpt: while *increasing inference cost* by over 20% on average
  artifact: normalized.md
  checked_at: '2026-11-19'
