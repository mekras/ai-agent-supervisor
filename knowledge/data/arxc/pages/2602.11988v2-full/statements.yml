  limitations:
  - Результат сообщён авторами одной работы, воспроизводимость эксперимента в корпусе
    не проверялась.
  - Контекстные файлы репозиториев не тождественны публикуемой коллекции навыков.
  - Отсутствие выигрыша согласуется с 2607.27250v1 (ARXC-071), но два из трёх его
    репозиториев (pdm и opshin) входят в CTXbench. Рост стоимости в 2607.27250v1 не
    подтверждён (ARXC-076).
  - 'В первой версии статьи (2602.11988v1) вывод сформулирован сильнее: контекстные
    файлы скорее снижали долю решённых задач.'
