- id: ARXC-010
  source_id: ARXC
  item_id: ARXC--2602.11988v2-full
  kind: fact
  text: Авторы советуют пока не использовать сгенерированные моделью контекстные файлы
    вопреки рекомендациям разработчиков агентов. Файлы, написанные людьми, по их мнению,
    должны содержать только инструкции, которых нет в README, например особые соглашения
    или нефункциональные требования, и проходить строгую оценку до внедрения.
  excerpt: should only include instructions required for coding agents that are not
    already present in the `README`
