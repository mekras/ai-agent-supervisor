- id: ARXC-008
  source_id: ARXC
  item_id: ARXC--2602.11988v2-full
  kind: fact
  text: 'Оценку контекстных файлов затрудняют две причины: в прежних бенчмарках их
    нет, а популярные репозитории, из которых обычно строят бенчмарки, нерепрезентативны
    для большинства кодовых баз.'
  excerpt: context files are not available for instances of prior benchmarks, and
    ii) popular, well-known repositories, typically used to create such benchmarks,
    are not representative of most codebases
  artifact: normalized.md
