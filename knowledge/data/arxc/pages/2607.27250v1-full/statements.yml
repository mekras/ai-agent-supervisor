- id: ARXC-057
  source_id: ARXC
  item_id: ARXC--2607.27250v1-full
  kind: fact
  text: Контролируемый эксперимент на двух агентах (Claude Code и Codex), 17 задачах
    из 3 репозиториев и 288 оценённых запусках не выявил влияния способа подачи контекста
    на правильность решения. Эффект ограничен 10–15 п. п. тестом эквивалентности.
  excerpt: bounded to ≤10–15pp via equivalence testing
  artifact: normalized.md
  checked_at: '2026-11-19'
