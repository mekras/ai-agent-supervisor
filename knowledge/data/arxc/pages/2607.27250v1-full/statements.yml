  - Согласуется с отсутствием значимого выигрыша от файлов разработчиков в 2602.11988v2
    (ARXC-026), но pdm и opshin входят в CTXbench, поэтому подтверждение не считается
    независимым.
- id: ARXC-058
  source_id: ARXC
  item_id: ARXC--2607.27250v1-full
  kind: fact
  text: 'Работа называет данные о пользе контекстных файлов противоречивыми: Lulla
    и соавторы сообщают о выигрыше в эффективности, Gloaguen и соавторы — об отсутствии
    значимого влияния на выполнение задач. Её цель — примирить эти результаты, меняя
    способ подачи контекста на агентах двух семейств.'
  excerpt: Yet empirical evidence is contradictory.
  artifact: normalized.md
