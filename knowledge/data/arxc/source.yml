id: ARXC
slug: arxc
title: "arXiv: исследования контекстных инструкций"
status: draft
priority: normal
carrier_type: website
source_kind: research
long_source: true
adapter: agent
agent_route:
  mode: agent
  instructions: Текущий агент открывает локатор и выбранные единицы доступным веб-инструментом. Обновляет
    индекс только в пределах scope источника, сохраняет ограничения доступа и копирования. Не расширяет
    выборку и не меняет прежние снимки. При полном проходе оставляет свидетельство по договору agent-index-evidence
    контроллера kc-pipeline.
  write_scope:
  - knowledge/data/arxc/
  allowed_operations:
  - index
storage_strategy: external_reference
processing_scope: selected_items
retrieval_mode: on_demand
copy_policy: per_item_license
allowed_use: "Точечное чтение выбранных работ. Для 2602.11988v2 и 2607.27250v1 (CC BY 4.0) в Git хранится нормализованный полный текст с атрибуцией и пометкой изменений, исходники LaTeX и PDF остаются локальными. Для 2601.20404v2 полный текст, исходники и PDF хранятся только локально, в Git — собственные формулировки утверждений и короткие атрибутированные цитаты. Условия каждой работы указаны в её normalized.md или normalized.local.md."
requires_access_check: true
locator: "https://arxiv.org"
public_reference: "https://arxiv.org"
access:
  default: "Публичные страницы выбранных работ без авторизации. Перед новым использованием проверить доступ и условия."
reliability: primary_research
stability: versioned
refresh_policy: on_demand
last_checked_at: "2026-09-07"
affects: [".apm/skills/"]
sensitivity: public
retrieval:
  method: "Точечное открытие URL выбранной версии встроенным веб-инструментом агента."
  owner: "Агент текущей задачи"
  automated_pipeline: agent_route
  limitation: "Индекс обновляет текущий агент по agent_route. Автоматический обход сайта не заявлен."
normalization:
  required_before_statements: true
  input: "Выбранный раздел конкретной версии по ссылке из items.yml."
  output: "Локальный нормализованный фрагмент с URL, разделом и ограничениями."
  restriction: "До получения и проверки фрагмента индекс не является основанием содержательного вывода."
use_policy:
  action: store_licensed_full_text_and_selected_fragments
  status: permitted
  basis: "Проверены ссылки view license выбранных версий 2026-09-07 и повторно 2026-11-19. 2602.11988v2 и 2607.27250v1 выпущены под CC BY 4.0. Для 2601.20404v2 нет общей лицензии на повторную публикацию. Хранение и публикация полного текста двух работ под CC BY 4.0 разрешены решением владельца .ai-dev-team/source-admission-arxc-fulltext-2026-11-19.yml, локальная обработка полного текста 2601.20404v2 — решением .ai-dev-team/source-admission-arxc-2601-local-2026-11-19.yml."
  scope: "Полный нормализованный текст 2602.11988v2 и 2607.27250v1 в Git, локальный полный текст 2601.20404v2 и утверждения по всем трём работам."
  checked_at: "2026-11-19"
  restrictions:
    - "Для 2601.20404v2 полный текст, исходники и PDF не попадают в Git, цитаты в утверждениях короткие."
    - "Публикация полного текста требует указания авторов, ссылки на лицензию и пометки изменений в normalized.md."
known_limitations:
  - "Полные тексты всех трёх работ нормализованы, текст 2601.20404v2 доступен только в локальном слое. Воспроизводимость экспериментов не проверялась."
  - "Работы о контекстных файлах не подтверждают автоматически эффект коллекции навыков."
  - "Результаты разных выборок и методов нельзя объединять голосованием источников."
processing_notes:
  - "Выборка нужна для проверки необходимости инструкций наряду с руководствами по их реализации."
  - "Из каждой аннотации извлечено одно ограниченное утверждение о сообщении авторов."
  - "2026-11-19 полные тексты 2602.11988v2 и 2607.27250v1 получены из исходников LaTeX, нормализованы и разобраны по разделам в source-map.yml."
  - "2026-11-19 полный текст 2601.20404v2 получен и нормализован локально, утверждения извлечены по разделам."
provenance:
  origin: external_material
  locator: "https://arxiv.org"
