  item_id: GITH--githooks
  kind: fact
  text: По умолчанию Git ищет хуки в $GIT_DIR/hooks. Настройка core.hooksPath может заменить каталог.
    Область применения определяется эффективной конфигурацией, а не только расположением скрипта.
