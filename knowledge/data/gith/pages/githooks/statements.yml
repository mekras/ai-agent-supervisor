- id: GITH-002
  source_id: GITH
  item_id: GITH--githooks
  kind: fact
  text: Ненулевой код pre-commit или commit-msg прерывает соответствующую операцию. Для этих событий предусмотрен
    обход через --no-verify, поэтому наличие хука не доказывает контроль всех путей.
