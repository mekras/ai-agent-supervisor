- id: CCDC-009
  source_id: CCDC
  item_id: CCDC--hooks
  kind: fact
  text: Настройки ~/.claude/settings.json относятся ко всем проектам пользователя, а .claude/settings.json
    и .claude/settings.local.json — к одному проекту. Управляемые настройки и подключённые плагины являются
    дополнительными источниками хуков.
  artifact: normalized.local.md
  checked_at: '2026-10-19'
