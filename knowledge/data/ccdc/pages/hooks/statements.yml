- id: CCDC-010
  source_id: CCDC
  item_id: CCDC--hooks
  kind: fact
  text: Отключение и доступность хуков зависят от источника настроек и политики администратора. Обычный
    пользователь не должен считать управляемый хук отключаемым тем же способом, что собственный.
