purpose: Основания сценариев нового навыка, внутренний материал проверки.
source_role: user
source: docs/decisions/DR-0006.md
source_section: Постоянный механизм наблюдений
limitations:
  - Это запись согласованного договора, а не свидетельство эффективности навыка.
  - Сценарии вымышлены и не заменяют реальное применение.
claims:
  - id: USAGE-001
    kind: fact
    text: >
      Владелец одобрил текущий проект по умолчанию, указанный проект вместо
      текущего и все доступные локальные сессии по глобальному запросу,
      без отдельного согласования списка проектов.
  - id: USAGE-002
    kind: fact
    text: >
      Механизм должен сохранять наблюдения между запусками и учитывать новые
      и дополненные сессии, включая ошибки и неизвестные исходы.
  - id: USAGE-003
    kind: limitation
    text: >
      Создание механизма не запускает анализ проектов. Анализ не разрешает
      нарушать ограничения доступа, публиковать историю или менять проекты.
  - id: USAGE-004
    kind: inference
    text: >
      Сохранность накопленных наблюдений требует обнаруживать замену исходного
      журнала, сохранять ранее обнаруженную ошибку с ограничением её повторной
      проверки и не использовать прежнюю позицию как подтверждённую.
    basis: USAGE-002
