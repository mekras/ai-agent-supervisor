purpose: Основания проверок обучения на опыте.
source_role: user
source: Принятые владельцем требования REQ-0013–REQ-0017 от 2026-09-08.
limitations:
  - Сценарии не подтверждают полезность на реальных задачах или работу внешней интеграции.
statements:
  - id: LEARNING-001
    source: docs/requirements/REQ-0013.md
    text: Обучение использует опыт для преобразования группы навыков и сохраняет связь с результатами.
  - id: LEARNING-002
    source: docs/requirements/REQ-0014.md
    text: Сокращение контекста сохраняет качество и оценивается с учётом полной стоимости.
  - id: LEARNING-003
    source: docs/requirements/REQ-0015.md
    text: Ручной запуск доступен без автоматической интеграции, повторные события не создают новые циклы.
  - id: LEARNING-004
    source: docs/requirements/REQ-0016.md
    text: Запуск обучения и право применять изменения определяются отдельно.
  - id: LEARNING-005
    source: docs/requirements/REQ-0017.md
    text: Применение сохраняет целостность группы и возможность восстановления без потери чужих изменений.
