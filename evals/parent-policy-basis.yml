statements:
  - id: PARENT-001
    statement: Модель, усилие, оснастка и доступ родителя являются условиями применимости зависимых назначений.
    basis: Уточнение пользователя 2026-10-05 и разрешение изменить навыки.
    limits: Это принятое проектное правило, а не измерение качества конкретной модели.
  - id: PARENT-002
    statement: Экономия политики оценивается по полной связке и сопоставимому прямому выполнению.
    basis: Цель пользователя и REQ-0003. Успех подагента не устанавливает полные затраты родителя.
    limits: Отсутствующие расходы не заполняются оценкой токенов подписки.
  - id: PARENT-003
    statement: История сохраняет параметры каждого участника и смены родителя без переноса приёмки между связками.
    basis: Наблюдавшийся вложенный запуск и обсуждение ограничения его применимости 2026-10-05.
    limits: Одно наблюдение не квалифицирует другие операции и модели.
  - id: PARENT-004
    statement: Разрешение на сравнительные генерации запрашивается после проверки исполнимости всего маршрута без модели и достаточности действующего бюджета организатора, если такой бюджет согласован.
    basis: Остановка подготовки 2026-10-07 до запуска кандидатов из-за конфликта read-only и служебной записи, затем явное поручение исправить подготовку.
    limits: Тестовый исполнитель проверяет механику, но не качество, экономию и поведение реальной модели. Подменённая граница транспорта остаётся неподтверждённой.
