statements:
  - id: PUBLICATION-ROUTE-001
    source: Согласованный пользователем пункт 4 о выборе проверки навыка перед публикацией, 2026-10-13
    status: accepted
    text: >
      Назначение, содержание, границы и качество навыка проверяет
      ai-skill-development. Пакет, проекции, установку и выпуск APM проверяет
      ai-setup-apm. Дополнительный аудит правил требует отдельного риска
      взаимодействия. Обязательные проверки APM сохраняются.
    scope: >
      Выбор проверки перед публикацией и приёмка на обычных формулировках задач.
      Самостоятельные функции навыков сохраняются. Экономия остаётся ожидаемой.
  - id: APM-VALIDATION-SCOPE-001
    source: Согласованное пользователем разделение проверки исходников, испытания установки и обновления окружения, 2026-10-13
    status: accepted
    text: >
      Изменение исходника навыка само по себе не требует установки.
      Проверка установки кандидата выполняется в отдельном тестовом
      проекте-потребителе без зависимостей среды разработки.
      Обновление рабочего окружения выполняется, когда входит в задачу,
      с сохранением защитных проверок установки и аудита.
    scope: >
      Основание сценариев выбора проверяемого состояния и сохранности
      рабочего окружения. Автоматические проверки и испытание кандидата
      не подтверждают применение этой процедуры моделью.
