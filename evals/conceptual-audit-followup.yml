purpose: Учёт исправлений концептуального разбора и основания сценариев.
source_role: user
source: Согласованный план исправлений пунктов 2–7 от 2026-09-07.
limitations:
  - Выполненные изменения и проверки не доказывают полезность коллекции.
  - Синтетические случаи проверяют отдельные дефекты, не заменяя применение.
  - Статус implementation_verified относится к исправлению подхода и его реализации, не к доказанному эффекту.
  - Реальная квалификация маршрутов и передача между сессиями сохраняют незавершённые состояния REQ-0005 и REQ-0006.
verification:
  - apm run tests завершился с кодом 0 после исправления полной переделки.
  - Безопасная установка с tools/run-apm-safe.py и аудитом tools/apm-audit-ci завершилась с кодом 0.
  - После редакторской правки description его бюджет и повторная установка проверены отдельно.
  - Проверены 102 цитаты утверждений, структура корпуса не содержит ошибок договора.
  - В корпусе сохраняются 74 предупреждения об отсутствии отдельных записей внешней проверки и актуальности.
  - Граф влияния проверен, все 626 учитываемых путей сопоставлены, смысловое влияние и влияние интерфейса закрыты.
  - Подагент выполнял вспомогательные проверки только чтением. Фактическая модель не подтверждена.
items:
  - id: 2
    subject: Результат, процедура и полезность
    status: implementation_verified
    evidence:
      - .apm/skills/ai-skill-development/references/validation.md
      - .apm/skills/ai-work-result-evaluation/SKILL.md
    verification:
      - В 13 сценариях шести навыков отрицательный пример привязан к конкретному нарушению.
      - Общие критерии больше не требуют признаков, невозможных без навыка.
      - Все 14 наборов сценариев прошли структурную проверку.
  - id: 3
    subject: Проверка причин провала без заранее выбранного объяснения
    status: implementation_verified
    evidence:
      - .apm/skills/ai-rule-failure-analysis/SKILL.md
      - .apm/skills/ai-rule-failure-analysis/evals/result-scenarios.json
      - evals/oracles/fixture-rule-failure-missed-step.json
    verification:
      - Обязательная проверка правил сохранена, инструмент, среда, данные и приёмка рассматриваются как альтернативные причины.
      - Сценарий сбоя инструмента допускает обоснованное сохранение правил.
    residual: Снижение частоты повторных ошибок не измерено.
  - id: 4
    subject: Достаточность контроля и границы автономии
    status: implementation_verified
    evidence:
      - .apm/skills/ai-work-control/SKILL.md
      - .apm/skills/ai-setup-project/SKILL.md
      - .apm/skills/ai-audit-project/SKILL.md
      - README.md
    verification:
      - Контроль ограничен риском, нужными свидетельствами и условием остановки.
      - Явная автономная область не требует повторного согласования неизменных действий.
      - Покрытие строк не требует доведения до идеала, модельный прогон после каждой правки не обязателен.
    residual: Изменение полной стоимости контроля проверяется по реальному применению.
  - id: 5
    subject: Качество, повторная работа и полная стоимость
    status: implementation_verified
    evidence:
      - docs/requirements/REQ-0003.md
      - docs/requirements/REQ-0005.md
      - docs/requirements/REQ-0006.md
      - docs/evaluation-protocol.md
    residual: Качество реальных маршрутов и экономия не подтверждены. Статусы требований и ограничения сохранены явно.
    verification:
      - Процедура и средство проверки используют свидетельство всего маршрута.
      - Статус передачи отделён от свидетельства экономии всей задачи.
      - Полная переделка при плановой эскалации воспроизведена как ошибочный отказ.
      - После исправления тот же сценарий и проверки политики выполнения прошли.
  - id: 6
    subject: Обещания инструкций, обнаружения и технического предотвращения
    status: implementation_verified
    evidence:
      - .apm/skills/ai-work-control/references/work-control.md
      - .apm/skills/ai-setup-hooks/SKILL.md
      - .apm/skills/ai-work-result-evaluation/SKILL.md
    verification:
      - Для предотвращения требуется проверенный механизм на конкретном пути исполнения.
      - Существование файлов и заполненность записи не объявляются достоверностью содержания.
      - Самопроверка и переименование роли не объявляются независимой проверкой.
    residual: Коллекция не контролирует все действия внешней оснастки и не создаёт отсутствующий технический след.
  - id: 7
    subject: Проверка оснований необходимости подхода
    status: implementation_verified
    evidence:
      - .apm/skills/ai-skill-development/SKILL.md
      - .apm/skills/ai-data-collection/references/data-collection-procedure.md
      - knowledge/data/arxc/source-map.yml
    verification:
      - Проверка необходимости отделена от руководства по реализации, учтены простой способ и опровергающие сведения.
      - В корпус добавлены три ограниченных сообщения авторов с разными исходами исследований.
      - Цитаты прослеживаются к выбранным версиям, оставшееся содержание явно отложено.
    residual: Полные исследования не разобраны и не воспроизведены. Они не доказывают необходимость нашей коллекции.
claims:
  - id: AUDIT-007
    kind: fact
    text: >
      Руководство по реализации не доказывает необходимость подхода. Для
      усложнения проверяют реальную потребность, более простой способ,
      поддерживающие и опровергающие сведения и условие отказа от усложнения.
      Объём проверки соразмерен риску, эффект оценивается по реальному применению.
  - id: AUDIT-006
    kind: fact
    text: >
      Инструкция, обнаружение нарушения и техническая блокировка имеют разный
      охват. Предотвращение требует проверенного механизма на конкретном пути.
      Проверка структуры не доказывает истинность сведений. Смена названия роли
      и самопроверка в той же сессии не создают независимой проверки.
  - id: AUDIT-005
    kind: fact
    text: >
      Итоговое качество, повторная работа и полная стоимость оцениваются
      раздельно. Автоматический допуск требует предварительной квалификации
      всего маршрута с условиями переходов. Неуспешная передача остаётся
      неуспешной, но не определяет экономический результат всей задачи.
  - id: AUDIT-004
    kind: fact
    text: >
      Дополнительный контроль требует отдельного риска, свидетельства и условия
      завершения. Обязательные ограничения сохраняются. Низкорисковые пробелы
      допустимы с обоснованием, а явная автономная область не требует повторного
      согласования неизменных действий и не разрешает выход за её пределы.
  - id: AUDIT-003
    kind: fact
    text: >
      Проверка правил обязательна, но причина не предрешена. Существенные
      объяснения сопоставляются по свидетельствам. Новые правила не создаются
      без основания, а эффект проверяется на реальном применении.
  - id: AUDIT-002
    kind: fact
    text: >
      Исправление разделяет успех задачи, соблюдение процедуры и полезность
      навыка. Работа без навыка может быть успешной. Обязательные ограничения
      сохраняются, а исполнение шагов не компенсирует недостигнутую цель.
