purpose: Договор сценариев подключения общей политики к корневой настройке.
source_role: user
source: .apm/skills/ai-setup-project/SKILL.md
source_section: Шаги настройки и делегирование
limitations:
  - Запись согласованного поведения, а не независимое свидетельство качества.
  - Сценарии вымышлены и не заменяют реальное применение.
claims:
  - id: SETUP-001
    kind: fact
    text: >
      Одобренный шаг проверяет общую политику после машинных инструкций
      и перед подагентами. Изменения требуют отдельного подтверждения
      и делегируются ai-setup-execution-policy. Существующая политика
      используется без пересоздания и копирования приватного ядра в проект.
      Отказ не блокирует остальные шаги и отражается в отчёте.
      Автоматический выбор модели и дорогая квалификация не входят в шаг.
