purpose: Договор сценариев единой настройки политики подагентов.
source_role: user
source: .apm/skills/ai-setup-project/SKILL.md
source_section: Шаги настройки и делегирование
limitations:
  - Запись согласованного поведения, а не независимое свидетельство качества.
  - Сценарии вымышлены и не заменяют реальное применение.
claims:
  - id: SETUP-001
    kind: fact
    text: >
      После машинных инструкций настройка политики подагентов включает общие
      пользовательские настройки и проектные уточнения. Изменения требуют
      отдельного подтверждения и передаются ai-setup-subagents единым шагом.
      Подходящая политика используется без пересоздания и копирования
      приватного ядра в проект. Отказ не блокирует остальные шаги.
      Автоматический выбор корневой модели и дорогие испытания не входят в шаг.
