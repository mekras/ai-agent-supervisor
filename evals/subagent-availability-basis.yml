statements:
  - id: SUBAGENT-AVAILABILITY-001
    source: Прямое поручение пользователя устранить зависимость навыков от запуска подагентов, 2026-10-13
    status: accepted
    text: >
      Отключение или недоступность подагентов не блокирует выполнимую профильную
      работу и проверку. Основной агент выполняет их самостоятельно без
      требования включить подагентов или согласовать процедурное исключение.
      Автоматическая настройка и испытания не отменяют решение об отключении.
    scope: Навыки пакета и передача профильным процедурам. Изменения ai-dev-team выполняются отдельно.
  - id: SUBAGENT-AVAILABILITY-002
    source: Критерий результата 2 в прямом поручении пользователя и сохраняемая процедура обработки отказа, 2026-10-13
    status: accepted
    text: >
      При недоступном запускателе или неуспешном запуске непринятый результат
      не используется. Основной агент продолжает доступную работу самостоятельно.
      Отсутствие записи не разрешает подставить старый ответ. Повтор без изменения
      среды или маршрута не заменяет самостоятельное выполнение.
    scope: Отказ, недоступность маршрута и отклонение результата. Запущенный процесс безопасно отделяется от изменений тех же артефактов.
  - id: SUBAGENT-AVAILABILITY-003
    source: Критерии результата 3 и 4 в прямом поручении пользователя, 2026-10-13
    status: accepted
    text: >
      Выполненная самопроверка обозначается явно и не называется независимой.
      Отсутствие подагента само по себе не означает невыполненную проверку.
      Реальные дефекты и недоступные необходимые свидетельства сохраняют
      собственные ограничения. Убирается обязательность отдельного исполнителя,
      возникающая только из процедуры навыка. Прямое внешнее требование сохраняется.
    scope: Способ проверки, содержательные критерии и границы приёмки.
