purpose: Проверка согласованного договора подтверждения модели.
source_role: user
source: .apm/skills/ai-setup-subagents/references/routing-patterns.md
source_section: Свидетельство модели
limitations:
  - Это договор поведения, не независимое измерение качества или экономии.
  - Сценарий вымышленный и не заменяет реальное применение.
claims:
  - id: MODEL-EVIDENCE-001
    kind: fact
    text: >
      Назначение модели не подтверждает её фактическое исполнение.
      Нужна проверяемая ссылка на событие оснастки в журнале запуска.
      При отсутствии свидетельства модель остаётся неподтверждённой,
      строгая проверка не проходит. Приёмка содержания остаётся отдельной.
