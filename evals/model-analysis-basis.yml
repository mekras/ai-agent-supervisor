purpose: Основания сценариев анализа моделей, внутренний материал проверки.
source_role: user
source: Согласование владельцем в текущей сессии 2026-10-02, 2026-10-03 и 2026-10-04.
limitations:
  - Это требования владельца и выводы о проверках, не свидетельство эффективности навыка.
  - Учебные сценарии не заменяют реальное применение.
claims:
  - id: MODEL-ANALYSIS-001
    kind: fact
    text: >
      Цели сохраняются в отдельном неверсионируемом пользовательском файле.
      При новом запуске их показывают для подтверждения или изменения.
      Сравнительный профиль сохраняется отдельно с датой, условиями, качеством,
      затратами, выбранными параметрами оценки и границами данных.
  - id: MODEL-ANALYSIS-002
    kind: fact
    text: >
      Область определяется выбранными подключениями независимо от среды агента.
      После получения каталога агент согласует охват всех доступных пар по умолчанию.
      Сокращение требует решения пользователя или конкретного ограничения. Этот выбор не разрешает модельные прогоны.
      Любые прогоны требуют отдельного явного разрешения.
  - id: MODEL-ANALYSIS-003
    kind: fact
    text: >
      Анализ использует полезные доступные данные, документацию, прежние результаты
      и историю сессий с учётом типовых задач, качества, исправлений и затрат.
      Навык должен работать и без истории, с известными характеристиками и пробелами.
  - id: MODEL-ANALYSIS-004
    kind: inference
    basis: MODEL-ANALYSIS-003
    text: >
      Повторное использование данных требует учитывать поздние возвраты,
      исключать двойной учёт одной задачи и сохранять неизвестность модели,
      усилия и затрат. Неполные новые данные не оправдывают молчаливую потерю
      прежнего полного результата.

  - id: MODEL-ANALYSIS-005
    kind: fact
    text: >
      Агент сам предлагает конкретные пути и имена, человек согласовывает их.
      По умолчанию файлы находятся в проекте или контекстной папке.
      При наличии VCS личные файлы должны быть исключены из версионирования.
      Прежнее требование размещать их обязательно вне репозитория отменено.

  - id: MODEL-ANALYSIS-006
    kind: fact
    text: >
      Охват определяется по актуальному каталогу
      выбранного доступа до подтверждения, с проверкой полноты и без
      примеси недоступных записей старого кеша или локальной политики.
  - id: MODEL-ANALYSIS-007
    kind: fact
    text: >
      Пользовательские наблюдения о приемлемом качестве более дешёвой модели
      с высоким усилием учитываются как исходные данные с ограничениями. Нельзя ограничивать модель
      низким усилием и простыми задачами по названию или прежнему назначению.
      Сравниваются пары на одинаковых задачах, без универсализации частного опыта.
  - id: MODEL-ANALYSIS-008
    kind: fact
    text: >
      Сначала собираются сопоставимые характеристики всех пар в согласованном
      охвате, без предварительных ролей или произвольного стартового набора.
      Измерения, заявления поставщика и пользовательский опыт различаются.
      Качество, полные затраты и при необходимости время описываются с условиями
      и неизвестными значениями. Рекомендации необязательны и следуют только
      из результатов сравнения. Реальные модели и личный опыт не вшиваются в навык.
  - id: MODEL-ANALYSIS-009
    kind: fact
    text: >
      Неизвестные характеристики не заменяют исследование. До завершения нужен
      разрешённый поиск опубликованных сравнительных измерений и условий расхода
      целевого доступа, с проверкой материалов и применимости. Отсутствие местных
      замеров не обнуляет опубликованные данные. Непроведённый поиск отличается
      от безрезультатного. При незавершённом сборе сохраняется частичный профиль.
      Агент предлагает конкретный ограниченный охват истории при необходимости
      согласования и использует уже предоставленные наблюдения.
  - id: MODEL-ANALYSIS-010
    kind: fact
    text: >
      Каталог выбранного доступа не подменяется инструментами текущей сессии.
      Настройки ролей не подтверждают доступность модели и не ограничивают её
      усилия. Итоговые пары сверяются с целевым каталогом, расхождения разрешаются
      явно, количество вариантов соответствует фактическому составу.
  - id: MODEL-ANALYSIS-011
    kind: fact
    text: >
      Повторный запуск явно показывает прочитанные сохранённые цели и спрашивает
      только их подтверждение или изменение. Уже выбранные пути не согласуются
      заново, неизменный файл целей не переписывается. Новые параметры не
      добавляются молча. Выбор всех доступных пар является подтверждением
      полного охвата до получения каталога. Уточнение состава без противоречий
      не требует повторного согласования.
  - id: MODEL-ANALYSIS-012
    kind: inference
    basis: MODEL-ANALYSIS-009
    text: >
      Официальные сведения об условиях продукта и первичные исследования качества
      имеют разные области применения. Ограничения источников применяются в их
      установленной области с соблюдением приоритета инструкций. Блокирующий
      конфликт исключает заявление о полном завершении исследования.
  - id: MODEL-ANALYSIS-013
    kind: inference
    basis: MODEL-ANALYSIS-009
    text: >
      Найденное сравнительное исследование разбирается для всех участников в
      целевом охвате. Неизвлечённые результаты имеют конкретные причины.
      Неполная воспроизводимость ограничивает доверие, но не обнуляет измерения.
      Рабочая сверка покрытия каждой модели и параметра определяет завершённость,
      без обязательного реестра источников в пользовательском профиле.
  - id: MODEL-ANALYSIS-014
    kind: inference
    basis: MODEL-ANALYSIS-009
    text: >
      Реальное применение выявило необходимость сверять карточки усилий,
      оценочные пометки, вид расхода и применимость тарифов. Внешний каталог
      не расширяет пользовательский, режим с делегированием не равен одиночному.
      Известные внешние измерения поддерживают ограниченные выводы для выбора,
      даже когда полный расход личной подписки неизвестен.
  - id: MODEL-ANALYSIS-015
    kind: inference
    basis: MODEL-ANALYSIS-008
    text: >
      Проверка реального профиля перед настройкой выявила неподтверждённые
      переходы от проверяемости задания к пригодности пары и от неизвестности
      одной пары к выбору другой. Каждая рекомендация требует собственного
      положительного основания с точным усилием, областью и границей аналогии.
      Известные ставки не позволяют назвать полную стоимость минимальной.
