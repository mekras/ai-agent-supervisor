purpose: Основания сценариев настройки маршрута Hermes → Codex.
source_role: user
source: .apm/skills/ai-setup-subagents/references/hermes-codex-route.md
source_section: Маршрут Hermes → Codex
limitations:
  - Фиксируется согласованный договор настройки, а не результат испытания Hermes.
  - Сценарии вымышлены и не подтверждают качество модели или экономию подписки.
claims:
  - id: HERMES-CODEX-001
    kind: fact
    text: >
      Родитель Hermes может использовать Codex как исполнителя ограниченной
      подзадачи. Поле target обозначает исполнителя. Каталог и адаптер класса
      относятся к Codex, а модель и усилие задаются отдельно для каждого
      класса. Отсутствие каталога Hermes не блокирует этот маршрут.
  - id: HERMES-CODEX-002
    kind: fact
    text: >
      Для использования подписки нужен подтверждённый вход Codex через ChatGPT
      в окружении будущего запуска и соответствующий выбранный провайдер.
      Авторизация Hermes этого не доказывает. Секреты не читаются и не
      копируются. При отсутствии входа следующее действие — codex login и
      повторная проверка codex login status в том же окружении.
  - id: HERMES-CODEX-003
    kind: fact
    text: >
      Сохранение конфигурации, загрузка инструкции Hermes, рабочее
      делегирование и экономия требуют отдельных свидетельств. Путь к
      инструкции нельзя угадывать. Ручной запуск и фиктивный адаптер не
      подтверждают автоматическое делегирование рабочей сессией Hermes.
