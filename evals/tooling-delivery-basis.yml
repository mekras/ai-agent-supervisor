statements:
  - id: TOOLING-DELIVERY-001
    kind: observation
    source: docs/requirements/REQ-0019.md
    text: >-
      Принятое требование к настройке публикуемой коллекции задаёт сверку
      всего комплекта оснастки, доставку отсутствующих рабочих копий,
      остановку при неразрешённом конфликте и границу обычного потребителя.
    scope: >-
      Основание регрессионных сценариев настройки. Принятие требования не
      подтверждает выполнение процедуры моделью.
