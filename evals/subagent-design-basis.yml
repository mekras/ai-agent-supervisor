purpose: Основание регрессионных сценариев проектирования политики подагентов.
source_role: user
source: .apm/skills/ai-setup-subagents/SKILL.md
source_section: Обязательный порядок
limitations:
  - Исправление согласовано после разбора реального случая в сессии от 2026-09-08.
  - Запись фиксирует требуемое поведение, а не независимое доказательство его полезности.
  - Сценарии вымышлены. Эффект в реальной работе пока не измерен.
claims:
  - id: SUBAGENT-DESIGN-001
    kind: fact
    text: >
      Перед технической настройкой проверяются карта существенных задач,
      полномочия и кандидаты, включая новые подходящие модели каталога.
      Старое назначение не заменяет обоснование. Подготовка вариантов
      отделяется от утверждения решения. Объём истории не подтверждает
      предметный охват задач. Малой задаче допустим прямой маршрут родителя.

  - id: SUBAGENT-DESIGN-002
    kind: fact
    text: >
      Повторный сбой в режиме внедрения требует проверки полной траектории,
      сохранённой политики и итогового ответа вместе. Общий технический отказ
      ограничивает подтверждение старых и новых назначений одинаково, но
      не отменяет полного предложения существенных маршрутов и кандидатов.
      Наличие кандидата только в файле не заменяет предложение пользователю.

  - id: SUBAGENT-DESIGN-003
    kind: fact
    text: >
      REQ-0011 и REQ-0012 закрепляют два отдельных обязательства. До вопроса
      агент находит доступные цели и показывает их с источниками. При каждом
      новом запуске требуется ответ пользователя, подтверждающий либо
      исправляющий цели. До него допустимо только чтение контекста о целях.
      В продолжении того же запуска ответ повторно не запрашивается.
      Ошибочная отмена подтверждения агентом не была решением пользователя.
    requirement_sources:
      - docs/requirements/REQ-0011.md
      - docs/requirements/REQ-0012.md

  - id: SUBAGENT-DESIGN-004
    kind: fact
    text: >
      Замечание владельца от 2026-09-08 выявило отмену ранее принятого
      обязательства под видом исправления соседнего дефекта. До изменения
      навыка и теста нужно сверить принятые требования и основания изменения,
      сохранив обязательства вне явно порученной правки.
    requirement_sources:
      - docs/requirements/README.md

  - id: SUBAGENT-DESIGN-005
    kind: fact
    text: >
      После разбора ошибок настройки в сессии от 2026-09-08 владелец поручил
      исправить навык: сравнивать делегирование с текущим родителем,
      отдельно обосновывать модель и усилие, рассматривать подходящие
      альтернативы и не считать штатное усилие доказательством достаточности.
      Коррекция требует перепроверки всей затронутой схемы. Итог различает
      предложение, техническую конфигурацию и проверенное исполнение.
      Обязательная отдельная проверка сохраняется при совпадении моделей.

  - id: SUBAGENT-DESIGN-006
    kind: fact
    text: >
      Рабочая политика должна различать родительскую задачу и отдельную
      делегируемую подзадачу. Прямое выполнение полной задачи, связанной с
      защищённым источником, не запрещает ограниченный read-only анализ с
      собственными входами и приёмкой. Запрет записи, утверждения решения и
      расширения области сохраняется у дочернего исполнителя. Микрозадача с
      дешёвой проверкой может остаться у родителя.
    requirement_sources:
      - .apm/skills/ai-setup-subagents/assets/worker-policy-entrypoint.md
      - .apm/skills/ai-setup-subagents/references/operation-policy.md

  - id: SUBAGENT-DESIGN-007
    kind: fact
    text: >
      Рабочее сравнение маршрута использует фактические параметры текущей
      родительской сессии. Сохранённое назначение в policy_design является
      историческим основанием. Неизвестные параметры оставляют сравнение
      нерешённым, а смена модели или усилия делает прежнее сравнение
      недействительным. Совпадение моделей само по себе не оправдывает
      передачу и не запрещает её.
    requirement_sources:
      - .apm/skills/ai-setup-subagents/assets/worker-policy-entrypoint.md
      - .apm/skills/ai-setup-subagents/references/operation-policy.md
