purpose: Основания настройки подагентов по готовому сравнительному профилю.
source_role: user
source: Поручение владельца 2026-10-04 доработать настройку на основе личного профиля.
limitations:
  - Договор поведения, не подтверждение экономии или пригодности конкретной модели.
claims:
  - id: SUBAGENT-PROFILE-001
    kind: fact
    text: >
      Настройка использует готовый сравнительный профиль и сохранённые цели,
      переносит конкретные измерения в проектные назначения с границами применимости.
      Исследование моделей не повторяется автоматически.
  - id: SUBAGENT-PROFILE-002
    kind: inference
    basis: SUBAGENT-PROFILE-001
    text: >
      Пары сверяются с каталогом исполнителя. Единицы и границы затрат сохраняются.
      Общий индекс, прежняя роль и отсутствие данных об альтернативе не доказывают
      пригодность. Неполнота одного назначения не блокирует остальные.
  - id: SUBAGENT-PROFILE-003
    kind: inference
    basis: SUBAGENT-PROFILE-001
    text: >
      Предложение, запись конфигурации, проверка запуска и качество на проекте
      различаются. Пилот требует конкретного вопроса и согласованного объёма.
      Технические вызовы не нужны для всех пар каталога. Внешний профиль
      не становится локально подтверждённым от успешного запуска.
  - id: SUBAGENT-PROFILE-004
    kind: inference
    basis: SUBAGENT-PROFILE-001
    text: >
      Первый независимый запуск по реальному профилю перенёс результаты генерации
      кода на ревью и проектирование, а пользовательский draft использовал как
      подтверждённую цель. Аналогия сохраняет кандидатов, но не оправдывает
      назначение без применимого основания или явного решения пользователя.
      Старый технический статус отличается от текущей проверки.
  - id: SUBAGENT-PROFILE-005
    kind: inference
    basis: SUBAGENT-PROFILE-003
    text: >
      Рабочая сессия может не иметь права записи в каталог оснастки, доступный
      внешней оболочке. Каталог журналов задаётся локальной политикой и проверяется
      в родительской среде до вызова модели. Отказ записи не означает недоступности
      модели и не разрешает автоматического расширения прав.
