statements:
  - id: HUMAN-COMMUNICATION-001
    kind: user_requirement
    text: "Общение агента с человеком должно быть частью продукта в отдельном максимально кратком навыке. При завершении поручения нужны явный результат, препятствие и конкретное продолжение, учитывающее уже полученные ответы."
    source: "Текущий диалог, 2026-10-07: согласованный разбор завершения ответа и запрос на продуктовый навык."
    limitation: "Причина доставки исходного правила неизвестна. Снижение частоты ошибки и экономия не измерены."
  - id: HUMAN-COMMUNICATION-002
    kind: user_requirement
    text: "Навык общения применяется ко всем сообщениям человеку, включая промежуточные. Ответ краткий, понятный, простыми словами и с главным в начале. Списки и заголовки используются, когда помогают восприятию. При проблеме предлагается решение или следующий шаг для его поиска. Сохраняются необходимые сведения и запрошенные подробность и формат. Внутренние машинные результаты остаются вне области навыка. Настройка проекта подключает навык одной строкой и проверяет охват прежнего подключения."
    source: "Текущий диалог, 2026-10-09: предложение расширить существующий навык и его подключение, согласованное владельцем с исключением рекомендации таблиц."
    limitation: "Наблюдение пользователя об улучшении ответов не подтверждает эффект новой версии навыка. Сравнительные модельные проверки и расходы не измерены."
