purpose: Согласованные основания сценариев управления сложностью.
source_role: user
source: docs/requirements/REQ-0020.md
limitations:
  - Это принятые условия поведения, а не доказательство эффективности.
  - Модельные сценарии подготовлены, выполнение моделью ещё не проверено.
claims:
  - id: COMPLEXITY-001
    kind: fact
    text: Управление сложностью является главным техническим принципом продукта. Упрощение сохраняет обязательное поведение и оценивает всю затронутую систему.
    source: docs/requirements/REQ-0020.md
  - id: COMPLEXITY-002
    kind: fact
    text: Результат анализа, контроля и приёмки по умолчанию передаётся в диалоге. Файл отчёта требует явного указания пользователя или применимой процедуры. Технические журналы и состояние сохраняются по своим правилам.
    source: .apm/skills/ai-human-communication/SKILL.md
    basis: Уточнение 2026-10-09 исправлено по поручению пользователя о повторном необязательном отчёте 2026-10-13.
  - id: COMPLEXITY-003
    kind: fact
    text: Миграция сохраняет согласованную проектную адаптацию и отдельную процедуру. Неизвестный изменённый блок вызывает конфликт до записи файлов.
    source: .apm/skills/ai-setup-subagents/SKILL.md
    basis: Исправление пункта 2 аудита продукта принято владельцем 2026-10-09.
