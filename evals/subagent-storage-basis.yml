statements:
  - id: SUBAGENT-STORAGE-001
    kind: accepted_requirement
    statement: Данные новых запусков локальны и исключены из Git, сохраняются до проверки и использования результатов и удаляются при завершении родительской задачи. Длительное хранение включается только по явному запросу для конкретного разбора или эксперимента. Прежние журналы и продуктовые роли сохраняются.
    basis: docs/requirements/REQ-0021.md
    limits: Завершение хранения вызывает родитель через рабочую процедуру. Обрыв сессии до этого шага оставляет данные для продолжения. Проверка команд с управляемым исполнителем не подтверждает соблюдение процедуры моделью.
