statements:
  - id: RECONCILE-001
    statement: Завершённый отказ связки обновляет решение по этой области, сохраняя прежние свидетельства отдельных классов.
    basis: Поручение настройки через навыки 8 октября 2026 года и завершённый локальный опыт с существенной переделкой ответа ребёнка.
    limits: Отказ одной связки не устанавливает непригодность модели для всех задач. Человеческая оценка опыта ещё не завершена.
  - id: RECONCILE-002
    statement: Разрешённая оценка стоимости по ставкам не требует известного списания подписки. Отмена токенного бюджета не отменяет разрешение генераций и учёт расходов.
    basis: Решения пользователя, сохранённые в передаче 8 октября 2026 года. Границы полной стоимости заданы REQ-0003.
    limits: Частичный кредитный эквивалент не подтверждает снижение полной стоимости. Отношения токенов не равны отношениям стоимости.
  - id: RECONCILE-003
    statement: Перед выводом о противоречии сопоставляются субъект, операция, условия, время и первичный источник утверждений.
    basis: В локальном опыте смешаны квалификация класса и связки, предписанная передача и самостоятельная маршрутизация, запрет исследования и сеть поставщика.
    limits: Это изменение договора для проверки обнаруженного риска. Улучшение качества модели новой процедурой ещё не измерено.
  - id: RECONCILE-004
    statement: Изменённый договор не наследует квалификацию старого, а сохранение файлов и остановка всех передач не доказывают достижения цели настройки.
    basis: REQ-0003, REQ-0005 и подтверждённая цель пользователя 8 октября 2026 года.
    limits: При внешнем блокере сохраняются незавершённость и конкретный следующий шаг. Новые модельные вызовы не запускаются автоматически.
