purpose: Основания проверки передачи истории между навыками настройки подагентов.
source_role: user
source: evals/history-handoff-decision.md
source_section: Договор и наблюдавшийся дефект
limitations:
  - Это договор и основания сценариев, не доказательство эффективности.
  - Вымышленные примеры не заменяют проверку на реальной истории.
claims:
  - id: HIST-001
    kind: fact
    text: Все этапы настройки должны выполняться через предназначенные навыки; доступная история должна учитываться при выборе операций.
  - id: HIST-002
    kind: inference
    text: Готовый применимый разбор следует переиспользовать, отделяя задачи, операции, продолжения и контрольные запуски.
    basis: HIST-001
  - id: HIST-003
    kind: limitation
    text: Факт использования не доказывает приёмку, частота задач не равна частоте операций, токены не равны полной стоимости.
  - id: HIST-004
    kind: limitation
    text: Передача истории не разрешает новые вызовы моделей, расширение доступа или запись запрещённых файлов.
