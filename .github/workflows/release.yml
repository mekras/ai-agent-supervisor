name: Выпуск коллекции

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Версия уже опубликованного тега исходной коллекции
        required: true
        type: string

concurrency:
  group: publish-ai-agent-supervisor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-portability:
    uses: ./.github/workflows/portability-checks.yml

  publish:
    needs: verify-portability
    name: Проверить и опубликовать
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      MARKETPLACE_TOKEN: ${{ secrets.APM_MARKETPLACE_TOKEN }}
      MARKETPLACE_REPOSITORY: mekras/apm-marketplace
      PACKAGE_NAME: ai-agent-supervisor
    steps:
      - name: Получить исходный тег
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0

      - name: Установить APM
        uses: microsoft/apm-action@v1
        with:
          setup-only: 'true'
          apm-version: '0.29.0'

      - name: Проверить готовность выпуска
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]
          manifest_version=$(awk '/^version:/ {print $2; exit}' apm.yml)
          test "$manifest_version" = "$RELEASE_VERSION"
          grep -Fq "## [$RELEASE_VERSION]" CHANGELOG.md
          apm run tests

      - name: Проверить доступ к реестру
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MARKETPLACE_TOKEN"

      - name: Получить реестр
        shell: bash
        run: |
          set -euo pipefail
          git clone --branch master \
            "https://x-access-token:${MARKETPLACE_TOKEN}@github.com/${MARKETPLACE_REPOSITORY}.git" \
            marketplace

      - name: Синхронизировать состав пакета
        id: sync-package
        shell: bash
        run: |
          set -euo pipefail
          package_dir="marketplace/packages/${PACKAGE_NAME}"
          candidate_dir="$RUNNER_TEMP/${PACKAGE_NAME}-candidate"
          previous_dir="$RUNNER_TEMP/${PACKAGE_NAME}-previous"
          test -f "$package_dir/apm.yml"
          rm -rf "$candidate_dir" "$previous_dir"
          mkdir -p "$candidate_dir"
          cp -a .apm "$candidate_dir/.apm"
          cp README.md CHANGELOG.md LICENSE "$candidate_dir/"
          cp "$package_dir/apm.yml" "$candidate_dir/apm.yml"
          RELEASE_VERSION="$RELEASE_VERSION" PACKAGE_DIR="$candidate_dir" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          package_manifest = Path(os.environ["PACKAGE_DIR"]) / "apm.yml"
          text = package_manifest.read_text(encoding="utf-8")
          text, count = re.subn(r"^version: .+$", f"version: {version}", text,
                                count=1, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit("Не найдена версия манифеста пакета")
          package_manifest.write_text(text, encoding="utf-8")
          PY
          package_tag="${PACKAGE_NAME}--v${RELEASE_VERSION}"
          if git -C marketplace rev-parse --verify --quiet "${package_tag}^{commit}" >/dev/null; then
            mkdir -p "$previous_dir"
            git -C marketplace archive "$package_tag" "packages/${PACKAGE_NAME}" | \
              tar -x -C "$previous_dir" --strip-components=2
            if diff -ruN "$previous_dir" "$candidate_dir"; then
              echo "Версия ${RELEASE_VERSION} уже опубликована с тем же составом."
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Тег ${package_tag} уже указывает на другой состав пакета." >&2
            exit 1
          fi
          rm -rf "$package_dir"
          mv "$candidate_dir" "$package_dir"
          RELEASE_VERSION="$RELEASE_VERSION" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          marketplace_manifest = Path("marketplace/apm.yml")
          text = marketplace_manifest.read_text(encoding="utf-8")
          pattern = (r"(source: \./packages/ai-agent-supervisor\n"
                     r"\s+version: )\"[^\"]+\"")
          text, count = re.subn(pattern, rf'\g<1>"{version}"', text, count=1)
          if count != 1:
              raise SystemExit("Не найдена версия пакета в реестре")
          marketplace_manifest.write_text(text, encoding="utf-8")
          PY
          if find "$package_dir" \( -name AGENTS.md -o -name .editorconfig \) \
            -print -quit | grep -q .; then
            echo "В состав пакета попал служебный файл проекта-разработчика" >&2
            exit 1
          fi

      - name: Собрать и проверить реестр
        if: steps.sync-package.outputs.already_published != 'true'
        working-directory: marketplace
        shell: bash
        run: |
          set -euo pipefail
          apm marketplace check
          apm pack --marketplace=claude,codex
          apm pack --marketplace=claude,codex --check-clean --dry-run
          git diff --check

      - name: Опубликовать версию пакета
        if: steps.sync-package.outputs.already_published != 'true'
        working-directory: marketplace
        shell: bash
        run: |
          set -euo pipefail
          package_tag="${PACKAGE_NAME}--v${RELEASE_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && {
            echo "Состав новой версии не отличается от текущего реестра." >&2
            exit 1
          }
          git commit -m "Опубликована коллекция ${PACKAGE_NAME} ${RELEASE_VERSION}"
          git tag -a "$package_tag" -m "Опубликована коллекция ${PACKAGE_NAME} ${RELEASE_VERSION}"
          git push --atomic origin master "$package_tag"

      - name: Проверить опубликованный пакет в изолированном проекте
        shell: bash
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir"' EXIT
          (
            cd "$consumer_dir"
            apm marketplace add "$GITHUB_WORKSPACE/marketplace" --name release-test --ref master
            apm install "${PACKAGE_NAME}@release-test" --target codex
            apm audit --ci
          )

      - name: Создать GitHub Release исходной коллекции
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --generate-notes
          fi
